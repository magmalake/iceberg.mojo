name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      # This repo consumes sibling magmalake tins by source path
      # (`-I ../hashes.mojo/src`, `-I ../avro.mojo/src`), so CI has to lay the
      # siblings out next to it.
      - uses: actions/checkout@v4
        with:
          path: iceberg.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          manifest-path: iceberg.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests and CLI build
        working-directory: iceberg.mojo
        run: pixi run -e ${{ matrix.env }} check

      - name: CLI smoke
        working-directory: iceberg.mojo
        run: |
          ./build/iceberg-mojo describe tests/fixtures/ident_part
          ./build/iceberg-mojo schema tests/fixtures/evolved
          ./build/iceberg-mojo snapshots tests/fixtures/unpartitioned
          ./build/iceberg-mojo files tests/fixtures/ident_part \
            --filter '["=","region","eu"]' \
            --rebase 'file:///Users/mseritan/dev/magmalake/iceberg.mojo/build/warehouse-root/warehouse/db=tests/fixtures'
