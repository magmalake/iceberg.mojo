name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Stable only. Every FFI sibling below is a pixi git source dependency,
    # and its source build drops a `.mojoc` compiled with 1.0.0 into the
    # environment; a nightly compiler refuses to load it. The `default`
    # (nightly) environment stays in pixi.toml for local use with a matching
    # compiler.
    name: ${{ matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [stable]
    steps:
      # This repo consumes sibling magmalake tins by source path
      # (`-I ../parquet.mojo/src`, …), so CI has to lay the siblings out next
      # to it. The four FFI tins (objectstore, zstd, lz4, brotli) are *also*
      # pixi git source dependencies, which is what installs their C shims into
      # the environment; the checkouts here supply their Mojo sources.
      # sqlite.mojo and postgres.mojo are the same shape, for libsqlite and
      # libpq. threads.mojo has no shim at all — it calls the pthread symbols
      # libc already exports — so a source checkout is all it needs.
      - uses: actions/checkout@v4
        with:
          path: iceberg.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/parquet.mojo
          path: parquet.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/roaring.mojo
          path: roaring.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/objectstore.mojo
          path: objectstore.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/lz4.mojo
          path: lz4.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/sqlite.mojo
          path: sqlite.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/postgres.mojo
          path: postgres.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/brotli.mojo
          path: brotli.mojo

      # MinIO is the only S3 server that actually verifies SigV4 signatures,
      # which is what makes the s3:// end-to-end test worth running. One static
      # binary, so no service container; tests/run_tests.sh skips the S3 tests
      # with a printed reason if this step does not produce one.
      - name: Fetch MinIO
        continue-on-error: true
        run: |
          mkdir -p iceberg.mojo/build
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)  URL=https://dl.min.io/server/minio/release/linux-amd64/minio ;;
            Linux/aarch64) URL=https://dl.min.io/server/minio/release/linux-arm64/minio ;;
            Darwin/arm64)  URL=https://dl.min.io/server/minio/release/darwin-arm64/minio ;;
            Darwin/x86_64) URL=https://dl.min.io/server/minio/release/darwin-amd64/minio ;;
            *) echo "no MinIO build for this platform"; exit 0 ;;
          esac
          curl -sSLf -o iceberg.mojo/build/minio "$URL" && chmod +x iceberg.mojo/build/minio
          ./iceberg.mojo/build/minio --version

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rehashes the git source dependencies and then declares the lock
          # out of date.
          pixi-version: v0.78.0
          manifest-path: iceberg.mojo/pixi.toml
          environments: ${{ matrix.env }}

      # `check` = tests + a CLI build. tests/run_tests.sh starts the REST
      # mock, MinIO and a throwaway PostgreSQL cluster (from the conda
      # `postgresql` package, so no Docker and no service container — GitHub's
      # macOS runners have neither) and exports $POSTGRES_TEST_DSN, which is
      # what makes the SQL-catalog tests run on Postgres as well as sqlite.
      # Both the ubuntu and the macos legs get it.
      - name: Unit tests and CLI build
        working-directory: iceberg.mojo
        run: pixi run -e ${{ matrix.env }} check

      - name: Lint (mojolint --lsp)
        working-directory: iceberg.mojo
        run: pixi run -e ${{ matrix.env }} lint

      # Through `pixi run`, because the CLI dlopens the objectstore/zstd/lz4
      # shims from $CONDA_PREFIX/lib and that variable only exists inside the
      # environment.
      - name: CLI smoke
        working-directory: iceberg.mojo
        run: |
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo describe tests/fixtures/ident_part
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo schema tests/fixtures/evolved
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo snapshots tests/fixtures/unpartitioned
          REBASE='file:///Users/mseritan/dev/magmalake/iceberg.mojo/build/warehouse-root/warehouse/db=tests/fixtures'
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo files tests/fixtures/ident_part \
            --filter '["=","region","eu"]' --rebase "$REBASE"
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/dv_v3 \
            --rebase "$REBASE"
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/eq_deletes_v2 \
            --rebase "$REBASE" --select id,region,_file --limit 2 --format json
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/evolved \
            --rebase "$REBASE" --filter '[">","id",3]' --lazy
          # Nested columns: JSON out, then a sub-field projection and a
          # predicate on a struct leaf, then CSV (the same JSON, one field).
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/nested_v2 \
            --rebase "$REBASE" --format json
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/nested_v2 \
            --rebase "$REBASE" --select addr.city,id --format json
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo cat tests/fixtures/nested_evo_v2 \
            --rebase "$REBASE" --filter '["=","addr.town","eu"]'
          pixi run -e ${{ matrix.env }} ./build/iceberg-mojo schema tests/fixtures/nested_part_v2

  write-interop:
    name: write interop (PyIceberg + DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: iceberg.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/parquet.mojo
          path: parquet.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/roaring.mojo
          path: roaring.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/objectstore.mojo
          path: objectstore.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/lz4.mojo
          path: lz4.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/sqlite.mojo
          path: sqlite.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/postgres.mojo
          path: postgres.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/brotli.mojo
          path: brotli.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: iceberg.mojo/pixi.toml
          environments: stable

      - uses: astral-sh/setup-uv@v5

      # Ten tables written by this library — unpartitioned, identity,
      # bucket[4], day and truncate[3], each at v2 and v3, three appends each
      # — read back by PyIceberg 0.11.1 and DuckDB 1.5.5, which then appends
      # to two of them for this reader to read.
      - name: Write tables and verify them elsewhere
        working-directory: iceberg.mojo
        run: pixi run -e stable verify-writes

      # The SQL catalog's own parity gate: writes through our SqlCatalog and
      # reads them back with PyIceberg's, then the other way round, over the
      # same sqlite file both times. See tools/verify_sql_catalog.py.
      - name: Verify the SQL catalog against PyIceberg's
        working-directory: iceberg.mojo
        run: pixi run -e stable verify-sql-catalog

      # The same gate over PostgreSQL, against
      # `SqlCatalog("postgresql+psycopg://…")` — including a catalog PyIceberg
      # creates from nothing, which we then read unchanged. The server comes
      # from scripts/with-pg-server.sh, not a service container.
      - name: Verify the SQL catalog against PyIceberg's, over PostgreSQL
        working-directory: iceberg.mojo
        run: pixi run -e stable verify-pg-catalog
