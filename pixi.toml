[workspace]
name = "iceberg-mojo"
version = "0.1.0"
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
description = "Native pure-Mojo Apache Iceberg — table metadata, snapshots, partition transforms, expressions, manifests and scan planning."
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI. hashes.mojo is consumed by *source path*, not as a pixi
# package: pixi-build-mojo emits a precompiled `.mojopkg`/`.mojoc` built with
# mojo-compiler 1.0.0, and the nightly compiler rejects those outright
# ("Precompiled file ... version 1.0.0 is older than compiler version
# 1.1.0.dev..."), so a package dependency cannot satisfy both environments.
# Consumers of *this* tin do the same: `-I ../iceberg.mojo/src`.
test = { cmd = "mkdir -p build && mojo build tests/iceberg_test.mojo -I src -I ../hashes.mojo/src -I ../avro.mojo/src -o build/iceberg-test && ./build/iceberg-test" }
# CI runs `check`: the tests plus a build of the CLI, so a broken CLI fails too.
check = { depends-on = ["test", "cli"] }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -I ../hashes.mojo/src -I ../avro.mojo/src -o build/iceberg-mojo" }
fmt = { cmd = "mojo format src tests" }
format-check = { cmd = "mojo format --check src tests" }

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is iceberg-mojo; the Mojo import stays `from iceberg import …`.
[package]
name = "iceberg-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/iceberg"
name = "iceberg"

[package.host-dependencies]
mojo-compiler = "==1.0.0"
hashes-mojo = { path = "../hashes.mojo" }

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"
hashes-mojo = { path = "../hashes.mojo" }
