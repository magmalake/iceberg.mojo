[workspace]
name = "iceberg-mojo"
version = "0.9.1"
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
description = "Native pure-Mojo Apache Iceberg — table metadata, snapshots, partition transforms, expressions, manifests, scan planning, multi-core data reads including nested columns, and writes: append, delete, overwrite and deletion vectors."
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64"]

# Sibling magmalake tins are consumed by *source path* (`-I ../x.mojo/src`),
# never as a built `.mojopkg`: pixi-build-mojo emits a package compiled with
# mojo-compiler 1.2.0 and the nightly compiler refuses to load it. CI checks
# each sibling out next to this repository.
#
# threads.mojo is a source-path sibling too and needs nothing else: it calls
# the pthread symbols libc already exports, with no shim and no build step.
#
# Four of the siblings are FFI tins whose C shims must be *installed* into the
# environment even though their Mojo code comes from the checkout next door:
# objectstore (libcurl), and zstd, lz4 and brotli — the Parquet page codecs
# parquet.mojo reads and writes. Those are git source dependencies below — a
# path dependency would break `pixi install` for a bare clone, because pixi
# solves every environment even when it installs one.
[dependencies]
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "76190bb31012cd2d2f6712c4e1724a66474215db" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "23cd6e54967d7e41573371507228ca5c958ca685" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "dcbf840d22e3deaf24c587d12d28570a9a882b7f" }
libcurl = ">=8,<9"
# sqlite.mojo (the SQL catalog's backing store) the same way: a git dependency
# purely so pixi installs its transitive C lib, while ICEBERG_INCLUDES below
# points the compiler at the source checkout instead of the built .mojopkg.
# Pinned to the rev mojoshelf published as 0.3.1, the first with
# `Database.changes()` — the row count the catalog's guarded UPDATE reads.
# It matters here and not for the other siblings because the stable toolchain
# resolves `sqlite` to this package's installed .mojopkg rather than to the
# `-I ../sqlite.mojo` source checkout.
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }
libsqlite = ">=3.45,<4"
sqlite = ">=3.45,<4"
# postgres.mojo, the SQL catalog's other backend, on the same terms: the git
# dependency is what installs libpq's dependency closure, while
# ICEBERG_INCLUDES points the compiler at ../postgres.mojo/src.
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
libpq = ">=16,<19"
# The full server (initdb, pg_ctl, pg_isready, createdb) is only used by the
# tests and the Postgres parity gate: scripts/pg-server.sh starts a throwaway
# cluster on a free port, so no Docker and no service container. psycopg is
# there for anything that wants to talk to it from Python without the
# PyIceberg venv.
postgresql = ">=16,<19"
psycopg = ">=3.2"
# The REST-catalog mock server and the fixture/oracle tooling.
python = ">=3.10,<3.14"
# MinIO for the S3/MinIO end-to-end scans, as a package rather than a
# download. CI used to curl the binary from dl.min.io, which now answers 410
# for every platform and every release: the open-source server is archived
# and the files are gone for good. The fetch step was `continue-on-error`, so
# nothing failed — the S3 tests just started skipping, silently, on both
# runners.
#
# conda-forge carries `RELEASE.2025-10-15T17-29-55Z`, the last community
# release and the one these tests were written against, for linux-64 and
# osx-arm64. It lands as `minio` on PATH, which is already what
# tests/run_tests.sh looks for after $MINIO_BINARY and build/minio.
#
# It will not receive updates, which is acceptable for a fixture that binds
# 127.0.0.1 with well-known test credentials and holds only throwaway
# fixtures. Having no SigV4-verifying server at all is not — and that is
# where CI had drifted.
minio-server = ">=2025.10.15"

# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "5799cd56eca15ad142a9c8ba300ad45c5eca96f4" }

# parquet-mojo 0.9.x keeps the Arrow layer in arrow-mlake-mojo, and threads-mojo
# keeps whatever the supported toolchains spell differently in a compat
# directory picked by the include path. Since threads-mojo 0.6.0 that is one
# directory rather than one per toolchain — Mojo 1.2.0 and the 1.3 nightlies
# agree on all of it — so the two lists below are identical today. They stay
# separate because pixi documents no ordering between activation variables, so
# building one out of the other would be a guess, and because the split comes
# back the moment the toolchains diverge again.
[feature.nightly.activation.env]
# sqlite.mojo's package directory is `sqlite/` at its repo root, not `src/`;
# postgres.mojo's is `src/postgres`, so it takes the usual `/src`.
ICEBERG_INCLUDES = "-I src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../hashes.mojo/src -I ../deflate.mojo/src -I ../avro.mojo/src -I ../thrift.mojo/src -I ../snappy.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../arrow-mlake.mojo/src -I ../memory-region.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../sqlite.mojo -I ../postgres.mojo/src"

[feature.stable.activation.env]
ICEBERG_INCLUDES = "-I src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../hashes.mojo/src -I ../deflate.mojo/src -I ../avro.mojo/src -I ../thrift.mojo/src -I ../snappy.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../arrow-mlake.mojo/src -I ../memory-region.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../sqlite.mojo -I ../postgres.mojo/src"

[tasks]
# Builds the test binary, brings up the REST mock (and MinIO and a throwaway
# PostgreSQL cluster when available), runs everything, tears them down. See
# tests/run_tests.sh.
test = { cmd = "bash tests/run_tests.sh" }
# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# tools/ is left out: tools/make_fixtures.mojo also imports iceberg_rs from
# ../iceberg-rs.mojo/src, a sibling CI does not check out for this repo.
lint = { cmd = "mojolint --lsp $ICEBERG_INCLUDES src tests bench" }
# CI runs `check`: the tests plus a build of the CLI, so a broken CLI fails too.
check = { depends-on = ["test", "cli", "lint"] }
build-test = { cmd = "mkdir -p build && mojo build tests/iceberg_test.mojo $ICEBERG_INCLUDES -o build/iceberg-test" }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo $ICEBERG_INCLUDES -o build/iceberg-mojo" }
bench = { cmd = "bash bench/run_bench.sh" }
# Snapshot expiry and commit cost on a long hourly history (5,000 snapshots,
# kept to 168): `pixi run bench-expiry [<dir> <snapshots>]`.
bench-expiry = { cmd = "mkdir -p build && mojo build bench/bench_expiry.mojo $ICEBERG_INCLUDES -o build/bench-expiry && rm -rf build/bench-expiry-wh && ./build/bench-expiry build/bench-expiry-wh 5000 --keep 168" }
# Per-stage profile of a full scan: where the milliseconds actually go.
profile = { cmd = "mkdir -p build && mojo build bench/profile_scan.mojo $ICEBERG_INCLUDES -o build/iceberg-profile && ICEBERG_BENCH_ROOT=${ICEBERG_BENCH_ROOT:-build/bench-warehouse} ./build/iceberg-profile" }
# The Arrow C Data Interface, from a nested scan into pyarrow. macOS wants
# .dylib and Linux .so; the shared-library task reads $SHLIB_EXT.
carrow-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_scan.mojo $ICEBERG_INCLUDES -o build/libibcarrow$SHLIB_EXT" }
# The same interface a batch at a time, over one scan split: the local
# counterpart of the Flight server's DoGet, for a consumer in this process.
# See tools/carrow_stream_scan.mojo.
# The producer half of a cross-process Arrow handover: publishes a split's
# buffers into a shared mapping and prints where they landed. See
# tools/shm_publish.mojo.
shm-publish = { cmd = "mkdir -p build && mojo build tools/shm_publish.mojo -I tools $ICEBERG_INCLUDES -o build/ib-shm-publish" }
# The consumer half, in Mojo: maps what the publisher points at and folds it
# without a copy. See tools/shm_consume.mojo.
shm-consume = { cmd = "mkdir -p build && mojo build tools/shm_consume.mojo -I tools $ICEBERG_INCLUDES -o build/ib-shm-consume" }
carrow-scan-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_stream_scan.mojo $ICEBERG_INCLUDES -o build/libibscan$SHLIB_EXT" }
# Writes ten tables with this library and has PyIceberg and DuckDB read them
# back — then lets PyIceberg append to two of them and reads the result here.
# Needs `uv`, which builds the venv; CI runs it as a fifth job.
verify-writes = { cmd = "bash tools/verify_writes.sh" }
# The SQL catalog's parity gate, both directions against PyIceberg's own
# `SqlCatalog` over the same sqlite file. See tools/verify_sql_catalog.py.
verify-sql-catalog = { cmd = "bash tools/verify_sql_catalog.sh" }
# The same gate over PostgreSQL, against PyIceberg's
# `SqlCatalog("postgresql+psycopg://…")` — same two catalog tables, same rows,
# read back cell-exact both ways. Runs under a throwaway server.
verify-pg-catalog = { cmd = "sh scripts/with-pg-server.sh bash tools/verify_pg_catalog.sh" }
fmt = { cmd = "mojo format src tests bench tools" }
# `mojo format` has no check mode in 1.2.0 — it rejects `--check`, and there is
# none among the hidden options either — so the check is: format, then assert the
# tree did not move. It rewrites the files as a side effect, which is what CI
# wants and is harmless locally; run it with your own work committed or stashed.
format-check = { cmd = "mojo format src tests bench tools && git diff --exit-code -- src tests bench tools" }

[target.osx-arm64.activation.env]
SHLIB_EXT = ".dylib"

[target.linux-64.activation.env]
SHLIB_EXT = ".so"

[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.stable.dependencies]
mojo-compiler = "==1.2.0"

[environments]
# `default` is the same as `stable`, now Mojo 1.2.0, because the published tins
# this depends on — postgres-mojo, sqlite-mojo, objectstore-mojo — ship
# `.mojoc` files compiled with it, and a precompiled Mojo package refuses to
# load against any other compiler version:
#
#   Precompiled file 'postgres.mojoc' version 1.2.0 is older than compiler
#   version 1.3.0.dev…
#
# So a nightly default was not a default anyone could use: `pixi run test`
# failed to parse while CI, which runs `-e stable`, was green. Pointing
# `default` at the toolchain the dependencies were built with means the
# obvious command works and matches what CI checks.
#
# `nightly` stays available by name for anyone testing against a newer
# compiler; it will only build once those tins are republished.
default = ["stable"]
stable = ["stable"]
nightly = ["nightly"]

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is iceberg-mojo; the Mojo import stays `from iceberg import …`.
[package]
name = "iceberg-mojo"
version = "0.9.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/iceberg"
name = "iceberg"
# Sibling tins arrive as .mojopkg in the host prefix; pixi-build-mojo does not
# add them to the import path on its own.
extra-args = ["-I", "$PREFIX/lib/mojo"]

# hashes.mojo comes in by git, pinned to a commit, rather than by path: a
# published package has to be self-contained, and pixi has no equivalent of
# Cargo's path-plus-version fallback, so a `../hashes.mojo` here would only
# ever resolve in this checkout.
[package.host-dependencies]
mojo-compiler = "==1.2.0"
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo", rev = "c3dfb87f5b09fb2559449dcb8b748629da4908af" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "d5b26ccefa8c49cc3af517731f5df104762119e0" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "395aca597f9410bd0511df44d972f14b10a8b01d" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "23cd6e54967d7e41573371507228ca5c958ca685" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "178aae6e0da0dbe105f9cb02632a51cfd35b9dda" }
# iceberg reads and writes ZSTD, so it wants the full codec set. This is the
# tin in parquet.mojo's full/ subdirectory; it pulls parquet-mojo with it.
parquet-full-mojo = { git = "https://github.com/magmalake/parquet.mojo", rev = "4cf043712aa386c1ed2403771969fb3e4c79ea2d", subdirectory = "full" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo", rev = "a90a7bd30cf1c21403a29059282072e93fbeeee2" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "21cdbce67d22d72e88e88a60e2f168b05b4ef9fa" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo", rev = "c3dfb87f5b09fb2559449dcb8b748629da4908af" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "d5b26ccefa8c49cc3af517731f5df104762119e0" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "395aca597f9410bd0511df44d972f14b10a8b01d" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "23cd6e54967d7e41573371507228ca5c958ca685" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "178aae6e0da0dbe105f9cb02632a51cfd35b9dda" }
# iceberg reads and writes ZSTD, so it wants the full codec set. This is the
# tin in parquet.mojo's full/ subdirectory; it pulls parquet-mojo with it.
parquet-full-mojo = { git = "https://github.com/magmalake/parquet.mojo", rev = "4cf043712aa386c1ed2403771969fb3e4c79ea2d", subdirectory = "full" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo", rev = "a90a7bd30cf1c21403a29059282072e93fbeeee2" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "21cdbce67d22d72e88e88a60e2f168b05b4ef9fa" }
