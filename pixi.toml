[workspace]
name = "iceberg-mojo"
version = "0.5.0"
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
description = "Native pure-Mojo Apache Iceberg — table metadata, snapshots, partition transforms, expressions, manifests, scan planning, multi-core data reads including nested columns, and writes: append, delete, overwrite and deletion vectors."
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64"]

# Sibling magmalake tins are consumed by *source path* (`-I ../x.mojo/src`),
# never as a built `.mojopkg`: pixi-build-mojo emits a package compiled with
# mojo-compiler 1.0.0 and the nightly compiler refuses to load it. CI checks
# each sibling out next to this repository.
#
# threads.mojo is a source-path sibling too and needs nothing else: it calls
# the pthread symbols libc already exports, with no shim and no build step.
#
# Three of the siblings are FFI tins whose C shims must be *installed* into the
# environment even though their Mojo code comes from the checkout next door:
# objectstore (libcurl), zstd and lz4 (the two Parquet codecs Iceberg writers
# actually use). Those are git source dependencies below — a path dependency
# would break `pixi install` for a bare clone, because pixi solves every
# environment even when it installs one.
[dependencies]
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo" }
libcurl = ">=8,<9"
# sqlite.mojo (the SQL catalog's backing store) the same way: a git dependency
# purely so pixi installs its transitive C lib, while ICEBERG_INCLUDES below
# points the compiler at the source checkout instead of the built .mojopkg.
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo" }
libsqlite = ">=3.45,<4"
sqlite = ">=3.45,<4"
# The REST-catalog mock server and the fixture/oracle tooling.
python = ">=3.10,<3.14"

[activation.env]
# sqlite.mojo's package directory is `sqlite/` at its repo root, not `src/`.
ICEBERG_INCLUDES = "-I src -I ../threads.mojo/src -I ../hashes.mojo/src -I ../avro.mojo/src -I ../thrift.mojo/src -I ../snappy.mojo/src -I ../parquet.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../sqlite.mojo"

[tasks]
# Builds the test binary, brings up the REST mock (and MinIO when available),
# runs everything, tears them down. See tests/run_tests.sh.
test = { cmd = "bash tests/run_tests.sh" }
# CI runs `check`: the tests plus a build of the CLI, so a broken CLI fails too.
check = { depends-on = ["test", "cli"] }
build-test = { cmd = "mkdir -p build && mojo build tests/iceberg_test.mojo $ICEBERG_INCLUDES -o build/iceberg-test" }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo $ICEBERG_INCLUDES -o build/iceberg-mojo" }
bench = { cmd = "bash bench/run_bench.sh" }
# Per-stage profile of a full scan: where the milliseconds actually go.
profile = { cmd = "mkdir -p build && mojo build bench/profile_scan.mojo $ICEBERG_INCLUDES -o build/iceberg-profile && ICEBERG_BENCH_ROOT=${ICEBERG_BENCH_ROOT:-build/bench-warehouse} ./build/iceberg-profile" }
# The Arrow C Data Interface, from a nested scan into pyarrow. macOS wants
# .dylib and Linux .so; the shared-library task reads $SHLIB_EXT.
carrow-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_scan.mojo $ICEBERG_INCLUDES -o build/libibcarrow$SHLIB_EXT" }
# Writes ten tables with this library and has PyIceberg and DuckDB read them
# back — then lets PyIceberg append to two of them and reads the result here.
# Needs `uv`, which builds the venv; CI runs it as a fifth job.
verify-writes = { cmd = "bash tools/verify_writes.sh" }
# The SQL catalog's parity gate, both directions against PyIceberg's own
# `SqlCatalog` over the same sqlite file. See tools/verify_sql_catalog.py.
verify-sql-catalog = { cmd = "bash tools/verify_sql_catalog.sh" }
fmt = { cmd = "mojo format src tests bench tools" }
format-check = { cmd = "mojo format --check src tests bench tools" }

[target.osx-arm64.activation.env]
SHLIB_EXT = ".dylib"

[target.linux-64.activation.env]
SHLIB_EXT = ".so"

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is iceberg-mojo; the Mojo import stays `from iceberg import …`.
[package]
name = "iceberg-mojo"
version = "0.5.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/iceberg"
name = "iceberg"
# Sibling tins arrive as .mojopkg in the host prefix; pixi-build-mojo does not
# add them to the import path on its own.
extra-args = ["-I", "$PREFIX/lib/mojo"]

# hashes.mojo comes in by git, pinned to a commit, rather than by path: a
# published package has to be self-contained, and pixi has no equivalent of
# Cargo's path-plus-version fallback, so a `../hashes.mojo` here would only
# ever resolve in this checkout.
[package.host-dependencies]
mojo-compiler = "==1.0.0"
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "0df43fc9037b98c280f74b14a80c319bae4f2934" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "7f56128396cf7f4dc7620ac23dc0b725f4b8a26f" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "36ec6c5ca1cef06c970db67710e072fd64849be7" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "3142f9e41c496473021ebc9681cec11231d1723b" }
parquet-mojo = { git = "https://github.com/magmalake/parquet.mojo", rev = "07cac80cf84520bca623755cdb1e2ea26b510578" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo", rev = "1e62801d5b4ef8e3c901ead1cc2047c3a9e6ca62" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f455f0ae3c2cbe862e1db14e13d219dc682e1896" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "5c474cbc4ccec1d98f5750598786d4e93d0fd931" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0a3c3cc3a8c19f6079ac1e414431671ed251c76b" }

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "0df43fc9037b98c280f74b14a80c319bae4f2934" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "7f56128396cf7f4dc7620ac23dc0b725f4b8a26f" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "36ec6c5ca1cef06c970db67710e072fd64849be7" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "3142f9e41c496473021ebc9681cec11231d1723b" }
parquet-mojo = { git = "https://github.com/magmalake/parquet.mojo", rev = "07cac80cf84520bca623755cdb1e2ea26b510578" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo", rev = "1e62801d5b4ef8e3c901ead1cc2047c3a9e6ca62" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f455f0ae3c2cbe862e1db14e13d219dc682e1896" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "5c474cbc4ccec1d98f5750598786d4e93d0fd931" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0a3c3cc3a8c19f6079ac1e414431671ed251c76b" }
